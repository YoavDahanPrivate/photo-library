    <title>Dahan · Family library</title>
    <style>
      .dahan-startup{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;background:#f7f8f4;color:#29483b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
      .dahan-startup section{max-width:300px}.dahan-startup .boot-mark{width:82px;height:82px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid #cad8cd;border-radius:24px;background:#e7eee6;font-size:40px;font-weight:600}.dahan-startup h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}.dahan-startup p{font-size:15px;line-height:1.6;color:#69766b;margin:8px 0}.boot-spinner{width:26px;height:26px;margin:28px auto 20px;border:3px solid #d6e0d5;border-top-color:#476c52;border-radius:50%;animation:boot-spin 1s linear infinite}.dahan-startup a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border:1px solid #9cad9c;border-radius:10px;color:#29483b;text-decoration:none;background:white}.dahan-startup #boot-wait[hidden]{display:none}
      @keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
    </style>
  </head>
  <body>
    <div id="dahan-startup" class="dahan-startup" role="status" aria-live="polite"><section><div class="boot-mark" aria-hidden="true">D</div><h1>Dahan</h1><p>Your family library</p><div class="boot-spinner" aria-hidden="true"></div><p id="boot-message">Opening your library…</p><div id="boot-wait" hidden><p>Taking longer than usual. Check that your home server is available.</p><a href="" id="boot-retry">Try again</a></div><noscript><p>Enable JavaScript to open Dahan.</p></noscript></section></div>
    <div id="root"></div>
    <script>
      (()=>{
        const wait=()=>{const el=document.getElementById('boot-wait');if(el)el.hidden=false;};
        const timer=setTimeout(wait,15000);
        window.addEventListener('dahan:ready',()=>clearTimeout(timer),{once:true});
        window.addEventListener('error',event=>{if(document.getElementById('dahan-startup')&&(event.target?.tagName==='SCRIPT'||event.target===window)){const text=document.getElementById('boot-message');if(text)text.textContent='Dahan could not finish opening.';wait();}},true);
        document.getElementById('boot-retry').addEventListener('click',event=>{event.preventDefault();window.location.reload();});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
